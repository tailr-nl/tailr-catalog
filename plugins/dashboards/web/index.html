<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My dashboards</title>
<link rel="stylesheet" href="/tailr-ui.css"></head><body>
<div class="page-head"><div><h1 data-i18n="My dashboards">My dashboards</h1><p data-i18n="Dashboards built by your AI. Review each new version before it can use your data."></p></div></div>
<div id="notice" role="status"></div><div id="pending"></div><div id="list"></div>
<section class="card"><div class="card-head"><h2 data-i18n="Have your AI build a dashboard"></h2></div><p data-i18n="Ask your connected AI tool to build and save a dashboard. It appears here for you to review before opening."></p><p class="hint" id="limits"></p><p class="hint" id="stats" hidden></p></section>
<script src="/api/frame/host.js"></script><script src="/api/p/dashboards/ui/shared.js"></script><script>
const { t, esc, name, call, toast, when, theme } = DashboardUI;
const base = "/api/p/dashboards", focus = new URLSearchParams(location.search).get("confirm");
const levels = { read: "Read", write: "Write", admin: "Admin" };
const statuses = { active: ["Active", "badge-success"], disabled: ["Off", "badge-neutral"], pending: ["To confirm", "badge-warning"], rejected: ["Rejected", "badge-danger"] };
const versionStatus = { pending: "To confirm", confirmed: "Confirmed", rejected: "Rejected", replaced: "Replaced" };
const problems = { not_available: "No access", write_not_allowed: "Read functions only", admin_not_allowed: "Admin functions are not allowed", not_allowed: "Not allowed in a dashboard" };
const used = (d, n) => name(d.usedTools?.find((tool) => tool.name === n) || { name: n });
const dots = '<svg width="22" height="22" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><circle cx="64" cy="128" r="16"/><circle cx="128" cy="128" r="16"/><circle cx="192" cy="128" r="16"/></svg>';
async function review(d) {
    const v = await call(`${base}/dashboards/${d.id}/versions/${d.pendingVersion}`), el = document.createElement("section");
    el.className = "card";
    el.id = `review-${d.id}`;
    el.innerHTML = `<div class="card-head"><h2>${esc(v.title)}</h2><div class="row"><span class="badge badge-warning">${esc(t("To confirm"))}</span><span class="hint">${esc(t("Version {n}", { n: v.version }))}</span></div></div>${v.description ? `<p>${esc(v.description)}</p>` : ""}<p class="hint">${esc(when(v.createdAt))} · ${Math.ceil(v.size / 1024)} kB</p><h3 class="section-title">${esc(t("Functions this dashboard may use"))}</h3><div class="table-wrap"><table class="data"><thead><tr><th>${esc(t("Function"))}</th><th>${esc(t("Level"))}</th></tr></thead><tbody>${v.tools.map(tool => `<tr><td><strong title="${esc(tool.name)}">${esc(name(tool))}</strong>${tool.problem ? `<span class="field-error">${esc(t(problems[tool.problem] || tool.problem))}</span>` : ""}</td><td>${esc(t(levels[tool.level] || "None"))}</td></tr>`).join("") || `<tr class="no-hover"><td colspan="2" class="muted">${esc(t("No functions"))}</td></tr>`}</tbody></table></div><p class="hint">${esc(t("Only confirm a dashboard you asked for. It runs in a sandbox with your permissions and cannot send data outside Tailr Core."))}</p><div class="form-actions"><button class="btn-link danger" data-act="reject">${esc(t("Reject"))}</button><span class="spacer"></span><button class="btn btn-secondary" data-act="code">${esc(t("View code"))}</button><button class="btn btn-secondary" data-act="preview">${esc(t("Preview without data"))}</button><button class="btn btn-primary" data-act="confirm" ${v.problems ? "disabled" : ""}>${esc(t("Confirm"))}</button></div><div data-slot="extra"></div>`;
    let preview;
    el.addEventListener("click", async (e) => {
        const button = e.target.closest("button[data-act]");
        if (!button)
            return;
        button.disabled = true;
        const action = button.dataset.act, extra = el.querySelector('[data-slot="extra"]');
        try {
            if (action === "confirm") {
                await call(`${base}/dashboards/${d.id}/versions/${v.version}/confirm`, { method: "POST", body: {} });
                toast("success", t("Dashboard confirmed"));
                window.parent.location.href = `/p/dashboards/view?id=${encodeURIComponent(d.id)}`;
            }
            if (action === "reject") {
                await call(`${base}/dashboards/${d.id}/versions/${v.version}/reject`, { method: "POST", body: {} });
                toast("success", t("Version rejected"));
                await load();
            }
            if (action === "code") {
                preview?.destroy();
                extra.innerHTML = "";
                const code = document.createElement("textarea");
                code.className = "textarea mono";
                code.readOnly = true;
                code.rows = 18;
                code.setAttribute("aria-label", t("View code"));
                code.value = v.html;
                extra.append(code);
            }
            if (action === "preview") {
                preview?.destroy();
                extra.innerHTML = "<div></div>";
                preview = TailrFrame.mount(extra.firstChild, { html: v.html, libraries: v.libraries, tools: v.tools.filter(tool => !tool.problem), locale: window.parent.tailr?.locale, theme: theme(), title: v.title });
            }
        }
        catch (err) {
            toast("error", t(err.message));
        }
        finally {
            button.disabled = false;
        }
    });
    return el;
}
function card(d) {
    const el = document.createElement("section");
    el.className = "card";
    const [label, cls] = statuses[d.status] || [d.status, "badge-neutral"];
    el.innerHTML = `<div class="card-head"><div class="row"><h2>${esc(d.title)}</h2><span class="badge ${cls}">${esc(t(label))}</span></div><div class="row">${d.status === "active" ? `<a class="btn btn-secondary btn-sm" href="/p/dashboards/view?id=${encodeURIComponent(d.id)}" target="_top">${esc(t("Open"))}</a>` : ""}<details class="menu"><summary class="btn-icon" aria-label="${esc(t("More actions for {name}", { name: d.title }))}" title="${esc(t("More actions for {name}", { name: d.title }))}">${dots}</summary><div class="menu-list">${d.activeVersion ? `<button type="button" class="${d.enabled ? "danger" : ""}" data-act="toggle">${esc(t(d.enabled ? "Turn off" : "Switch on"))}</button>` : ""}<button type="button" class="danger" data-act="delete">${esc(t("Delete"))}</button></div></details></div></div>${d.description ? `<p>${esc(d.description)}</p>` : ""}${d.uses.length ? `<p class="hint">${esc(t("Uses"))}: ${d.uses.map(n => `<span title="${esc(n)}">${esc(used(d, n))}</span>`).join(", ")}</p>` : ""}<details class="disclosure"><summary>${esc(t("Versions ({n})", { n: d.versions.length }))}</summary><div class="disclosure-body"><div class="table-wrap"><table class="data"><thead><tr><th>${esc(t("Version"))}</th><th>${esc(t("Status"))}</th><th>${esc(t("Created"))}</th><th class="table-actions"></th></tr></thead><tbody>${d.versions.map(v => `<tr><td>${v.version}${v.active ? ` <span class="badge badge-success">${esc(t("Active"))}</span>` : ""}</td><td>${esc(t(versionStatus[v.status] || v.status))}</td><td class="nowrap">${esc(when(v.createdAt))}</td><td class="table-actions">${v.status === "confirmed" && !v.active ? `<button class="btn btn-secondary btn-sm" data-act="activate" data-v="${v.version}">${esc(t("Restore"))}</button>` : ""}</td></tr>`).join("")}</tbody></table></div></div></details>`;
    el.addEventListener("click", async (e) => { const button = e.target.closest("button[data-act]"); if (!button)
        return; const action = button.dataset.act; button.closest("details.menu")?.removeAttribute("open");
    // Bevestigen met de dialoog van de kern (plugin-API 1.9), niet met de dialoog van de browser
    const ask = { delete: { title: t("Delete dashboard {name}?", { name: d.title }), text: t("All its versions are deleted too. This cannot be undone."), action: t("Delete"), danger: true }, toggle: d.enabled ? { title: t("Turn off dashboard {name}?", { name: d.title }), text: t("It can no longer be opened until you switch it on again."), action: t("Turn off"), danger: true } : null, activate: { title: t("Restore version {n}?", { n: button.dataset.v }), text: t("This version becomes the active version of {name}.", { name: d.title }), action: t("Restore") } }[action];
    if (ask && !(await window.parent.tailr.confirm(ask)))
        return; button.disabled = true; try {
        if (action === "toggle")
            await call(`${base}/dashboards/${d.id}/enabled`, { method: "POST", body: { enabled: !d.enabled } });
        if (action === "activate")
            await call(`${base}/dashboards/${d.id}/versions/${button.dataset.v}/activate`, { method: "POST", body: {} });
        if (action === "delete")
            await call(`${base}/dashboards/${d.id}`, { method: "DELETE" });
        toast("success", t(action === "delete" ? "Dashboard deleted" : "Saved"));
        await load();
    }
    catch (err) {
        toast("error", t(err.message));
    }
    finally {
        button.disabled = false;
    } });
    return el;
}
async function load() { const notice = document.getElementById("notice"), pending = document.getElementById("pending"), list = document.getElementById("list"); notice.innerHTML = pending.innerHTML = list.innerHTML = ""; try {
    const cfg = await call(`${base}/config`);
    document.getElementById("limits").textContent = t("Maximum {n} kB per dashboard.", { n: cfg.maxKb }) + (cfg.readOnly ? " " + t("Read functions only.") : "");
    // Alleen voor beheerders: de tellerregel over alle medewerkers
    const s = cfg.stats;
    if (s) {
        const stats = document.getElementById("stats");
        stats.textContent = t("All employees: {dashboards} · {employees} · {pending}", { dashboards: s.items === 1 ? t("1 dashboard") : t("{n} dashboards", { n: s.items }), employees: s.owners === 1 ? t("1 employee") : t("{n} employees", { n: s.owners }), pending: t("{n} awaiting confirmation", { n: s.pending }) });
        stats.hidden = false;
    }
    const items = await call(`${base}/dashboards`);
    for (const d of items.filter(d => d.pendingVersion))
        pending.append(await review(d));
    for (const d of items.filter(d => d.activeVersion || !d.pendingVersion))
        list.append(card(d));
    if (!items.length)
        list.innerHTML = `<section class="empty-state compact"><div class="empty-state-head"><h2>${esc(t("No dashboards yet"))}</h2><p>${esc(t("Ask your connected AI tool to build and save a dashboard. It appears here for you to review before opening."))}</p></div></section>`;
    if (focus)
        document.getElementById(`review-${focus}`)?.scrollIntoView({ block: "start" });
}
catch (err) {
    notice.innerHTML = `<div class="alert alert-danger">${esc(t(err.message))}</div>`;
} }
load();
</script></body></html>
