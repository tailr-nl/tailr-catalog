<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboards</title></head><body>
<div class="page-head"><div><h1>Dashboards</h1><p data-i18n="Control who can build dashboards and which functions they may use."></p></div></div>
<form id="form" class="card"><fieldset class="connection-fieldset" id="fields" disabled>
<label class="checkbox"><input type="checkbox" name="enabled"><strong data-i18n="Enable dashboards"></strong></label><p class="hint" data-i18n="When turned off, nobody can save or open dashboards and the AI cannot see their functions."></p>
<div class="field"><label data-i18n="Who may create dashboards"></label><div id="roles" class="stack"></div><p class="hint"><span data-i18n="No selection: everyone with write access to this plugin."></span> <a href="/permissions" target="_top" data-i18n="Access → Permissions"></a></p></div>
<div class="field"><label for="maxKb" data-i18n="Maximum size per dashboard (kB)"></label><input id="maxKb" class="input" name="maxKb" type="number" min="1" step="1" required style="max-width:160px"><span id="maxHint" class="hint"></span></div>
<div class="field"><label data-i18n="Libraries"></label><div id="libraries" class="stack"></div><p class="hint" data-i18n="Only libraries from Tailr Core’s reviewed list are available."></p></div>
<label class="checkbox"><input type="checkbox" name="readOnly"><span data-i18n="Read functions only (recommended)"></span></label><p class="hint" data-i18n="This prevents dashboards from changing data, even if the AI is misled."></p>
<div class="form-actions"><button class="btn btn-primary" type="submit" id="save" disabled data-i18n="Save"></button></div></fieldset><p id="stats" class="hint"></p></form>
<script src="/api/p/dashboards/ui/shared.js"></script><script>
const { t, esc, call, toast } = DashboardUI, form = document.getElementById("form"), fields = document.getElementById("fields"), save = document.getElementById("save");
let initial = "";
const values = () => ({ enabled: form.elements.enabled.checked, readOnly: form.elements.readOnly.checked, maxKb: Number(form.elements.maxKb.value), creatorRoles: [...form.querySelectorAll('[name="role"]:checked')].map(i => i.value), libraries: [...form.querySelectorAll('[name="library"]:checked')].map(i => i.value) });
form.addEventListener("input", () => { save.disabled = JSON.stringify(values()) === initial; });
async function load() { try {
    const [cfg, roles] = await Promise.all([call("/api/admin/p/dashboards/settings"), call("/api/admin/roles")]);
    form.elements.enabled.checked = cfg.enabled;
    form.elements.readOnly.checked = cfg.readOnly;
    form.elements.maxKb.value = cfg.maxKb;
    form.elements.maxKb.max = cfg.hardMaxKb;
    document.getElementById("maxHint").textContent = t("Default 200 kB, maximum {n} kB.", { n: cfg.hardMaxKb });
    document.getElementById("roles").innerHTML = roles.map(r => `<label class="checkbox"><input type="checkbox" name="role" value="${esc(r.id)}" ${cfg.creatorRoles.includes(r.id) ? "checked" : ""}>${esc(r.name)}</label>`).join("") || esc(t("No roles yet"));
    document.getElementById("libraries").innerHTML = cfg.availableLibraries.map(l => `<label class="checkbox"><input type="checkbox" name="library" value="${esc(l.id)}" ${cfg.libraries.includes(l.id) ? "checked" : ""}>${esc(l.title)}</label>`).join("");
    const s = cfg.stats || {};
    document.getElementById("stats").textContent = [s.items === 1 ? t("1 dashboard") : t("{n} dashboards", { n: s.items || 0 }), s.owners === 1 ? t("1 employee") : t("{n} employees", { n: s.owners || 0 }), t("{n} awaiting confirmation", { n: s.pending || 0 })].join(" · ");
    initial = JSON.stringify(values());
    fields.disabled = false;
    save.disabled = true;
}
catch (err) {
    toast("error", t(err.message));
} }
form.addEventListener("submit", async (e) => { e.preventDefault(); if (JSON.stringify(values()) === initial)
    return; const body = values(); fields.disabled = true; save.textContent = t("Saving…"); try {
    await call("/api/admin/p/dashboards/settings", { method: "PUT", body });
    toast("success", t("Saved"));
    await load();
}
catch (err) {
    toast("error", t(err.message));
}
finally {
    fields.disabled = false;
    save.textContent = t("Save");
    save.disabled = JSON.stringify(values()) === initial;
} });
load();
</script></body></html>
