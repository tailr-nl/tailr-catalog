<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <style>
    .db-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .db-bar h1 { margin: 0; font-size: 20px; }
    .db-bar .spacer { flex: 1; }
    .db-frame { border: 1px solid var(--border, #e5e7eb); border-radius: 12px; overflow: hidden; background: var(--surface, transparent); }
  </style>
</head>
<body>
  <div class="db-bar">
    <a class="back-link" href="/p/dashboards" target="_top">← Mijn dashboards</a>
    <h1 id="title">Dashboard</h1>
    <span class="badge badge-neutral" id="version"></span>
    <span class="spacer"></span>
    <button class="btn btn-secondary btn-sm" id="reload" type="button">Vernieuwen</button>
  </div>
  <div id="notice"></div>
  <div class="db-frame" id="frame"></div>
  <p class="hint" id="footer"></p>

  <script src="/api/frame/host.js"></script>
  <script>
    const tailr = window.parent.tailr;
    const call = (path, init) => tailr ? tailr.api(path, init) : fetch(path, { method: init?.method ?? (init?.body ? "POST" : "GET"), headers: { "content-type": "application/json" }, body: init?.body ? JSON.stringify(init.body) : undefined }).then(async (r) => { const j = await r.json(); if (!r.ok) throw Object.assign(new Error(j.error?.message ?? j.error ?? r.status), { body: j }); return j; });
    const base = "/api/p/dashboards";
    const id = new URLSearchParams(location.search).get("id") ?? "";
    const theme = () => { try { return window.parent.document.documentElement.dataset.theme === "dark" ? "dark" : "light"; } catch { return "light"; } };
    const notice = (cls, html) => (document.getElementById("notice").innerHTML = html ? `<div class="alert ${cls}">${html}</div>` : "");
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    let frame;

    async function show() {
      frame?.destroy();
      notice("", "");
      const holder = document.getElementById("frame");
      holder.innerHTML = "";
      let d;
      try {
        d = await call(`${base}/dashboards/${encodeURIComponent(id)}/frame`);
      } catch (err) {
        const code = err.body?.code;
        notice(code === "not_confirmed" ? "alert-warning" : "alert-danger", code === "not_confirmed" ? `Dit dashboard is nog niet bevestigd. <a href="/p/dashboards?confirm=${encodeURIComponent(id)}" target="_top">Bekijken en bevestigen</a>` : esc(err.message));
        return;
      }
      document.getElementById("title").textContent = d.title;
      document.getElementById("version").textContent = `versie ${d.version}`;
      document.title = d.title;
      if (d.missing.length) notice("alert-warning", `Je hebt geen toegang (meer) tot: ${d.missing.map((m) => `<code>${esc(m)}</code>`).join(", ")}. Dat deel van het dashboard werkt niet.`);
      else if (d.pendingVersion) notice("alert-info", `Er wacht een nieuwe versie (${d.pendingVersion}). <a href="/p/dashboards?confirm=${encodeURIComponent(id)}" target="_top">Bekijken en bevestigen</a>`);
      document.getElementById("footer").textContent = `Draait afgeschermd met jouw rechten. Gebruikt: ${d.tools.map((t) => t.name).join(", ") || "geen functies"}.`;
      frame = TailrFrame.mount(holder, {
        html: d.html,
        libraries: d.libraries,
        tools: d.tools,
        title: d.title,
        locale: tailr?.locale,
        theme: theme(),
        call: async (name, args) => {
          const r = await call(`${base}/dashboards/${encodeURIComponent(id)}/call`, { method: "POST", body: { name, args } }).catch((err) => err.body ?? { ok: false, error: { code: "call_failed", message: err.message } });
          if (!r.ok) throw Object.assign(new Error(r.error?.message ?? "The call failed."), { code: r.error?.code ?? "call_failed" });
          return r.data;
        },
        onEvent: (e) => {
          if (e.type === "navigated") notice("alert-danger", "Dit dashboard probeerde naar een andere pagina te gaan en is gestopt. Vraag je AI om het aan te passen, of zet het uit.");
          if (e.type === "limited") notice("alert-warning", "Dit dashboard doet te veel aanroepen tegelijk; een deel is overgeslagen.");
        },
      });
    }
    document.getElementById("reload").addEventListener("click", show);
    show();
  </script>
</body>
</html>
