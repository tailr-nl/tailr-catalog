<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title>
<style>.db-frame{background:transparent}.db-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}.db-toolbar h1{flex:1;margin:0}.db-toolbar h1[hidden]{display:none}</style></head><body>
<a class="connection-back" href="/p/dashboards" target="_top">← <span data-i18n="My dashboards"></span></a>
<div class="db-toolbar"><h1 id="title">Dashboard</h1><span class="badge badge-neutral" id="version"></span><button class="btn btn-secondary btn-sm" id="reload" type="button" data-i18n="Refresh"></button></div>
<div id="notice" role="status"></div><div class="db-frame" id="frame"></div><details class="connection-section"><summary data-i18n="About this dashboard"></summary><p class="hint" id="footer"></p></details>
<script src="/api/frame/host.js"></script><script src="/api/p/dashboards/ui/shared.js"></script><script>
const { t, esc, name, call, theme } = DashboardUI, base = "/api/p/dashboards", id = new URLSearchParams(location.search).get("id") || "";
const notice = (tone, html) => document.getElementById("notice").innerHTML = html ? `<div class="alert ${tone}">${html}</div>` : "";
const reviewLink = () => `<a href="/p/dashboards?confirm=${encodeURIComponent(id)}" target="_top">${esc(t("Review and confirm"))}</a>`;
let frame;
async function show() { const button = document.getElementById("reload"); button.disabled = true; frame?.destroy(); notice("", ""); const holder = document.getElementById("frame"); holder.innerHTML = ""; try {
    const d = await call(`${base}/dashboards/${encodeURIComponent(id)}/frame`);
    document.getElementById("title").textContent = d.title;
    document.getElementById("title").hidden = false;
    document.getElementById("version").textContent = t("Version {n}", { n: d.version });
    document.title = d.title;
    if (d.missing.length)
        notice("alert-warning", esc(t("Some required functions are no longer accessible. Parts of this dashboard may not work.")));
    else if (d.pendingVersion)
        notice("alert-info", esc(t("A new version awaits confirmation.")) + " " + reviewLink());
    document.getElementById("footer").textContent = t("Runs in a sandbox with your permissions.") + " " + t("Uses") + ": " + (d.tools.map(name).join(", ") || t("No functions"));
    frame = TailrFrame.mount(holder, { html: d.html, libraries: d.libraries, tools: d.tools, title: d.title, locale: window.parent.tailr?.locale, theme: theme(), call: async (name, args) => { const r = await call(`${base}/dashboards/${encodeURIComponent(id)}/call`, { method: "POST", body: { name, args } }).catch(err => err.body || { ok: false, error: { message: err.message } }); if (!r.ok)
            throw Object.assign(new Error(r.error?.message || "The call failed."), { code: r.error?.code || "call_failed" }); return r.data; }, onEvent: (event) => { if (event.type === "heading")
            document.getElementById("title").hidden = Boolean(event.title); if (event.type === "navigated")
            notice("alert-danger", esc(t("This dashboard tried to navigate away and was stopped. Ask your AI to update it."))); if (event.type === "limited")
            notice("alert-warning", esc(t("This dashboard is making too many requests. Some were skipped."))); } });
}
catch (err) {
    notice("alert-danger", esc(t(err.message)) + (err.body?.code === "not_confirmed" ? " " + reviewLink() : ""));
}
finally {
    button.disabled = false;
} }
document.getElementById("reload").addEventListener("click", show);
show();
</script></body></html>
