<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Handleiding</title>
  <link rel="stylesheet" href="/tailr-ui.css">
  <!-- Links in de handleiding openen de pagina zelf, niet dit frame -->
  <base target="_top">
</head>
<body>
  <div id="edit" hidden>
    <div class="toolbar"><div class="toolbar-actions"><a class="btn btn-secondary btn-sm" href="/p/handleiding/beheer" target="_top" data-t="Handleiding aanpassen">Handleiding aanpassen</a></div></div>
  </div>
  <div id="error" hidden><div class="alert alert-danger" id="error-text"></div></div>
  <p class="muted" id="loading" data-t="Laden…">Laden…</p>
  <!-- De HTML komt van de server: de veilige omzetter van de kern (api.markdown.render) -->
  <article class="card markdown" id="guide" hidden></article>

  <script>
    const tailr = window.parent.tailr;
    const t = (key, vars) => (tailr && tailr.t ? tailr.t(key, vars) : key);
    const call = (path) => (tailr ? tailr.api(path) : fetch(path).then(async (r) => { const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j; }));
    for (const el of document.querySelectorAll("[data-t]")) el.textContent = t(el.dataset.t);
    const locale = tailr?.locale === "nl" ? "nl" : "en";

    call(`/api/p/handleiding/guide?locale=${locale}`)
      .then((doc) => {
        const guide = document.getElementById("guide");
        guide.innerHTML = doc.html;
        guide.hidden = false;
        document.getElementById("edit").hidden = !doc.canEdit;
      })
      .catch((err) => {
        document.getElementById("error-text").textContent = err.message;
        document.getElementById("error").hidden = false;
      })
      .finally(() => (document.getElementById("loading").hidden = true));
  </script>
</body>
</html>
