<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mededeling</title>
  <link rel="stylesheet" href="/tailr-ui.css">
  <base target="_top">
</head>
<body>
  <div class="page-head"><div>
    <h1 data-t="Mededeling">Mededeling</h1>
    <p data-t="Een korte mededeling bovenaan elke pagina, voor iedereen of voor bepaalde rollen.">Een korte mededeling bovenaan elke pagina, voor iedereen of voor bepaalde rollen.</p>
  </div></div>

  <p class="muted" id="loading" data-t="Laden…">Laden…</p>
  <div id="status" role="status" hidden><div class="alert alert-info" id="status-text"></div></div>
  <div id="error" hidden><div class="alert alert-danger" id="error-text"></div></div>

  <div id="preview-card" class="card" hidden>
    <div class="card-head"><h2 data-t="Voorbeeld">Voorbeeld</h2></div>
    <div class="alert alert-info" id="preview"><div class="markdown" id="preview-text"></div></div>
  </div>

  <script>
    const tailr = window.parent.tailr;
    const t = (key, vars) => (tailr && tailr.t ? tailr.t(key, vars) : key.replace(/\{(\w+)\}/g, (m, k) => (vars && k in vars ? vars[k] : m)));
    const call = (path, init) => tailr ? tailr.api(path, init) : fetch(path, { method: init?.method ?? (init?.body ? "POST" : "GET"), headers: { "content-type": "application/json" }, body: init?.body ? JSON.stringify(init.body) : undefined }).then(async (r) => { const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j; });
    for (const el of document.querySelectorAll("[data-t]")) el.textContent = t(el.dataset.t);
    const $ = (id) => document.getElementById(id);
    const BASE = "/api/admin/p/mededeling";
    const locale = tailr?.locale === "nl" ? "nl" : "en";
    const date = (iso) => new Date(iso.length === 10 ? `${iso}T12:00:00` : iso).toLocaleDateString(locale === "nl" ? "nl-NL" : "en-GB", { day: "numeric", month: "long", year: "numeric" });
    const showError = (msg) => { $("error-text").textContent = msg || ""; $("error").hidden = !msg; };

    function showStatus(state) {
      const m = state.announcement;
      let text;
      if (!m) text = t("Er staat nu geen mededeling.");
      else if (m.badDate) text = t("De einddatum {date} klopt niet: niemand ziet de mededeling. Gebruik JJJJ-MM-DD, bijv. 2026-12-31.", { date: m.badDate });
      else if (state.expired) text = t("Verlopen op {date}: niemand ziet hem nog.", { date: date(m.until) });
      else {
        text = m.roles.length ? t("Te zien voor {n} rol(len).", { n: m.roles.length }) : t("Te zien voor iedereen.");
        if (m.until) text += " " + t("Tot en met {date}.", { date: date(m.until) });
        if (m.dismissible) text += " " + t("{n} keer weggeklikt.", { n: state.dismissed });
        if (m.by) text += " " + t("Bericht van {name}, {date}", { name: m.by, date: date(m.at) });
      }
      $("status-text").textContent = text;
      $("status-text").className = `alert ${m && state.expired ? "alert-warning" : "alert-info"}`;
      $("status").hidden = false;
      // Het voorbeeld in de kleur van de mededeling, met dezelfde omzetter als de banner
      $("preview").className = `alert alert-${m ? m.tone : "info"}`;
      $("preview-text").innerHTML = state.html;
      $("preview-card").hidden = !m;
    }

    call(`${BASE}/status?locale=${locale}`)
      .then(showStatus)
      .catch((err) => showError(err.message))
      .finally(() => { $("loading").hidden = true; });
  </script>
</body>
</html>
